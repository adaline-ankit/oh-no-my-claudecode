[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "oh-no-my-claudecode"
version = "0.113.0"
description = "Memory-grounded autonomous coding loops for Claude Code and Codex."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "ONMC Contributors" }
]
keywords = [
  "coding-agents",
  "claude-code",
  "codex",
  "autonomous-agents",
  "agent-orchestration",
  "agent-memory",
  "mcp",
  "developer-tools",
  "verified-execution",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]
dependencies = [
  # mcp 2.0 renamed Tool/Resource kwargs (inputSchema -> input_schema); cap
  # until mcp_server/ is migrated.
  "mcp>=1.0.0,<2.0",
  "pydantic>=2.8,<3.0",
  "pyyaml>=6.0,<7.0",
  "questionary>=2.0.0",
  "rich>=13.7,<16.0",
  "typer>=0.12,<1.0",
  "watchdog>=3.0.0",
]

[project.optional-dependencies]
# Optional multi-language codegraph parsing (JS/TS/Go/Rust/Java).  Absent by
# default — `onmc codegraph` falls back to Python-`ast` only when unavailable.
treesitter = [
  "tree-sitter>=0.23,<1.0",
  "tree-sitter-language-pack>=0.7",
]
sqlitevec = [
  "sqlite-vec>=0.1.0",
]
# Optional local ONNX embedder via fastembed (CPU, no API key, no network at
# inference time).  Absent by default — the hash-ngram embedder is used instead.
# Select at runtime with ONMC_EMBEDDER=fastembed.
fastembed = [
  "fastembed>=0.3",
]
# Optional unified multi-provider LLM backend.  Absent by default — the built-in
# Anthropic/OpenAI/Ollama providers work without it; the `litellm` provider
# reports itself unavailable gracefully until this extra is installed.
litellm = [
  "litellm>=1.0",
]
# Optional external memory provider backends.  Absent by default — the
# ``builtin`` adapter (onmc's own SQLite store) is always available without
# any extras.  Each extra enables one external provider; credentials (API
# keys) are still required at runtime for the provider to report available().
mem0 = [
  "mem0ai>=0.1",
]
supermemory = [
  "supermemory>=0.1",
]
# Optional CrewAI interop.  Absent by default — ``onmc crews export`` is pure
# and always works; ``onmc crews run`` requires this extra to execute a crew.
crewai = [
  "crewai>=0.80",
]
# Optional Microsoft AutoGen / AG2 backend.  Absent by default — ``onmc teams
# export`` works without it (pure); ``onmc teams run`` requires it.
autogen = [
  "pyautogen>=0.2",
]
# Optional LangChain document loaders.  Absent by default — the langchain
# importer reports itself unavailable gracefully until this extra is installed.
langchain = [
  "langchain-community>=0.3",
  "langchain-text-splitters>=0.3",
]
dev = [
  "build>=1.2.2",
  "mypy>=1.11,<3.0",
  "pre-commit>=3.8,<5.0",
  "pytest-cov>=6.0,<8.0",
  "pytest>=8.3,<10.0",
  "ruff>=0.15,<1.0",
  "twine>=5.1,<7.0",
]

[project.scripts]
onmc = "oh_no_my_claudecode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oh_no_my_claudecode", "src/onmc"]

[tool.hatch.build.targets.wheel.force-include]
"src/oh_no_my_claudecode/py.typed" = "oh_no_my_claudecode/py.typed"
"src/onmc/py.typed" = "onmc/py.typed"

[tool.pytest.ini_options]
addopts = "-q -p no:capture"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# gh_aw.py embeds shell/YAML templates as Python string literals; S608 fires
# on grep patterns inside those strings (false positive — no SQL involved).
"src/oh_no_my_claudecode/integrations/gh_aw.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
packages = ["oh_no_my_claudecode"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["yaml", "sqlite_vec"]
ignore_missing_imports = true

# Optional unified LLM backend — absent by default and ships no type stubs.
[[tool.mypy.overrides]]
module = ["litellm"]
ignore_missing_imports = true

# Optional tree-sitter parsers are dynamic C extensions without type stubs.
[[tool.mypy.overrides]]
module = ["tree_sitter", "tree_sitter_language_pack"]
ignore_missing_imports = true

# Optional fastembed ONNX embedder — no type stubs bundled.
[[tool.mypy.overrides]]
module = ["fastembed"]
ignore_missing_imports = true

# Optional CrewAI interop backend — no type stubs bundled.
[[tool.mypy.overrides]]
module = ["crewai"]
ignore_missing_imports = true

# Optional AutoGen / AG2 backends — no type stubs bundled.
[[tool.mypy.overrides]]
module = ["autogen", "ag2"]
ignore_missing_imports = true

# Optional LangChain document loaders — no type stubs bundled.
[[tool.mypy.overrides]]
module = ["langchain_community", "langchain_community.*", "langchain_text_splitters", "langchain_text_splitters.*"]
ignore_missing_imports = true

[tool.uv]
# Security overrides for transitive deps pulled in only by the optional `crewai`
# extra (never installed by default; see [project.optional-dependencies]).
#
# json-repair: crewai pins `~=0.25.2`, but that range is vulnerable
# (GHSA-xf7x-x43h-rpqh, high). Force the patched line — json_repair's
# `repair_json` API is stable across this bump, so crewai interop is unaffected.
#
# NOTE: chromadb (GHSA-f4j7-r4q5-qw2c, critical, CVE-2026-45829) is also pulled
# in transitively by crewai (`~=1.1.0`) and has NO patched release upstream
# (latest 1.5.9 is still in the vulnerable range). The advisory is a
# pre-authentication code-injection in the ChromaDB *server*; onmc never runs
# that server (crewai uses chromadb only as an embedded local client), so the
# vulnerable code path is not reachable. Tracked via a dismissed Dependabot
# alert; revisit if crewai ships a chromadb bump with a fixed release.
override-dependencies = ["json-repair>=0.60.1"]
