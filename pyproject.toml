[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "oh-no-my-claudecode"
version = "0.63.0"
description = "Memory-grounded autonomous coding loops for Claude Code and Codex."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "ONMC Contributors" }
]
keywords = [
  "coding-agents",
  "claude-code",
  "codex",
  "autonomous-agents",
  "agent-orchestration",
  "agent-memory",
  "mcp",
  "developer-tools",
  "verified-execution",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]
dependencies = [
  "mcp>=1.0.0",
  "pydantic>=2.8,<3.0",
  "pyyaml>=6.0,<7.0",
  "questionary>=2.0.0",
  "rich>=13.7,<16.0",
  "typer>=0.12,<1.0",
  "watchdog>=3.0.0",
]

[project.optional-dependencies]
# Optional multi-language codegraph parsing (JS/TS/Go/Rust/Java).  Absent by
# default — `onmc codegraph` falls back to Python-`ast` only when unavailable.
treesitter = [
  "tree-sitter>=0.23,<1.0",
  "tree-sitter-language-pack>=0.7",
]
sqlitevec = [
  "sqlite-vec>=0.1.0",
]
dev = [
  "build>=1.2.2",
  "mypy>=1.11,<3.0",
  "pre-commit>=3.8,<5.0",
  "pytest-cov>=6.0,<8.0",
  "pytest>=8.3,<10.0",
  "ruff>=0.15,<1.0",
  "twine>=5.1,<7.0",
]

[project.scripts]
onmc = "oh_no_my_claudecode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oh_no_my_claudecode", "src/onmc"]

[tool.hatch.build.targets.wheel.force-include]
"src/oh_no_my_claudecode/py.typed" = "oh_no_my_claudecode/py.typed"
"src/onmc/py.typed" = "onmc/py.typed"

[tool.pytest.ini_options]
addopts = "-q -p no:capture"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# gh_aw.py embeds shell/YAML templates as Python string literals; S608 fires
# on grep patterns inside those strings (false positive — no SQL involved).
"src/oh_no_my_claudecode/integrations/gh_aw.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
packages = ["oh_no_my_claudecode"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["yaml", "sqlite_vec"]
ignore_missing_imports = true

# Optional tree-sitter parsers are dynamic C extensions without type stubs.
[[tool.mypy.overrides]]
module = ["tree_sitter", "tree_sitter_language_pack"]
ignore_missing_imports = true
