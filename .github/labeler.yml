# Path-based area labels for PRs (actions/labeler v6 schema). Priority, kind,
# size, and risk labels are managed by .github/workflows/triage.yml.
area/ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/**"

area/docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "README.md"
          - "CONTRIBUTING.md"
          - "CHANGELOG.md"
          - "SECURITY.md"
          - ".github/ISSUE_TEMPLATE/**"
          - ".github/pull_request_template.md"
          - "CITATION.cff"

area/mcp:
  - changed-files:
      - any-glob-to-any-file:
          - "src/oh_no_my_claudecode/mcp_server/**"
          - "src/oh_no_my_claudecode/mcp_trust/**"

area/memory:
  - changed-files:
      - any-glob-to-any-file:
          - "src/oh_no_my_claudecode/storage/**"
          - "src/oh_no_my_claudecode/recall/**"
          - "src/oh_no_my_claudecode/models/**"
          - "src/oh_no_my_claudecode/ingest/**"

area/setup:
  - changed-files:
      - any-glob-to-any-file:
          - "src/oh_no_my_claudecode/setup/**"
          - "src/oh_no_my_claudecode/hooks/**"
          - "src/oh_no_my_claudecode/integrations/**"

area/agent-runtime:
  - changed-files:
      - any-glob-to-any-file:
          - "src/oh_no_my_claudecode/swarm/**"
          - "src/oh_no_my_claudecode/loop/**"
          - "src/oh_no_my_claudecode/autopilot/**"
          - "src/oh_no_my_claudecode/nomistakes/**"
          - "src/oh_no_my_claudecode/adapters/**"
