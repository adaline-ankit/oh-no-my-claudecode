name: release

# Triggers:
#   1. Push of a version tag (vX.Y.Z) — runs the full gate then publishes.
#   2. A GitHub Release published manually — same job, publish only.
#   3. workflow_dispatch — manual trigger for testing (publish step is tag-guarded).
on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── gate ──────────────────────────────────────────────────────────────────
  # Run the same quality checks as ci.yml before touching PyPI.
  # Only required on tag pushes; on `release: published` the release creator
  # is responsible for having a green main branch first (see docs/RELEASING.md).
  gate:
    name: gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: MyPy
        run: mypy src
      - name: Pytest with coverage
        run: pytest --cov=oh_no_my_claudecode --cov-report=term-missing --cov-fail-under=80

  # ── build ─────────────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    # On a tag push, wait for the gate to pass first.
    needs: [gate]
    if: |
      always() &&
      (
        !startsWith(github.ref, 'refs/tags/v') ||
        needs.gate.result == 'success'
      )
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 30

  # ── publish ───────────────────────────────────────────────────────────────
  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    # Only publish on actual tag pushes or manually-published GitHub Releases.
    # workflow_dispatch without a tag does NOT publish.
    #
    # PYPI_TRUSTED_PUBLISHING gate: this job is intentionally skipped until the
    # PyPI trusted publisher is configured for this repository. Once the one-time
    # setup is complete (see docs/RELEASING.md § "PyPI trusted publishing"),
    # set the repository variable PYPI_TRUSTED_PUBLISHING=true to enable this job.
    # Until then, tagging vX.Y.Z still produces a GitHub Release (see job below).
    if: |
      always() &&
      needs.build.result == 'success' &&
      vars.PYPI_TRUSTED_PUBLISHING == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release')
    permissions:
      contents: read
      id-token: write
    environment:
      # Must match the trusted publisher configured on PyPI.
      name: pypi
      url: https://pypi.org/project/oh-no-my-claudecode/
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI (trusted publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  # ── github-release ────────────────────────────────────────────────────────
  github-release:
    name: create GitHub Release
    runs-on: ubuntu-latest
    # Depends on build only — NOT on publish. The GitHub Release is independent
    # of PyPI. A skipped or failed publish must not block the release from being
    # created. The build artifact (sdist + wheel) is always attached.
    needs: [build]
    # Only create a release on tag pushes (not on `release: published` events,
    # which already have a release).
    if: |
      always() &&
      needs.build.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Create GitHub Release with auto-generated notes
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
