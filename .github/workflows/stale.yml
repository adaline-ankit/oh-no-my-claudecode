name: stale

# Gently ages out abandoned issues / PRs. Conservative timings; never touches
# anything labelled good first issue / help wanted / pinned / security.
on:
  schedule:
    - cron: "30 1 * * *" # daily, 01:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stale
  cancel-in-progress: false

jobs:
  stale:
    name: mark and close stale
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10.3.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "good first issue,help wanted,pinned,security,needs-triage"
          exempt-pr-labels: "good first issue,help wanted,pinned,security"
          exempt-all-milestones: true
          stale-issue-message: >-
            This issue has been inactive for 60 days and is now marked stale.
            Comment to keep it open, otherwise it will close in 14 days.
          stale-pr-message: >-
            This pull request has been inactive for 60 days and is now marked
            stale. Push an update or comment to keep it open, otherwise it will
            close in 14 days.
          close-issue-message: "Closed as stale. Reopen any time with new detail — no hard feelings. 🧠"
          close-pr-message: "Closed as stale. Reopen any time once you can pick it back up."
          operations-per-run: 60
          ascending: true
