name: triage

# Deterministic issue/PR triage. It does not run contributor code and only
# manages label families that describe routing, priority, risk, and size.
on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      number:
        description: "Issue or PR number to re-triage"
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: triage-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.number || github.run_id }}
  cancel-in-progress: true

jobs:
  label:
    name: priority, kind, size, and risk labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const inputNumber = context.payload.inputs?.number;
            const isPullRequestEvent = Boolean(context.payload.pull_request);
            const eventItem = context.payload.pull_request || context.payload.issue;
            const issue_number = Number(inputNumber || eventItem?.number);

            if (!issue_number) {
              core.info("No issue or PR number available; skipping.");
              return;
            }

            const labelDefinitions = {
              "needs-triage": ["fbca04", "Needs maintainer review and routing"],
              "priority/P0": ["b60205", "Critical: security, data loss, release breakage, or unusable core workflow"],
              "priority/P1": ["d93f0b", "High impact: core agent workflow or CI is broken for many users"],
              "priority/P2": ["fbca04", "Important but not release-blocking"],
              "priority/P3": ["d4c5f9", "Backlog, cleanup, polish, or narrow improvement"],
              "kind/bug": ["d73a4a", "Bug fix, regression, broken behavior, or failing command"],
              "kind/feature": ["a2eeef", "New user-facing capability or workflow"],
              "kind/docs": ["0075ca", "Documentation-only or contributor guidance change"],
              "kind/ci": ["bfdadc", "CI, GitHub Actions, release automation, packaging, or repo ops"],
              "kind/security": ["b60205", "Security, trust policy, secret handling, or abuse-prevention work"],
              "kind/refactor": ["c5def5", "Internal cleanup without intended behavior change"],
              "kind/tests": ["0e8a16", "Test-only change or test coverage expansion"],
              "kind/release": ["5319e7", "Versioning, changelog, release notes, or publishing flow"],
              "kind/dependencies": ["0366d6", "Dependency, lockfile, or compatibility update"],
              "risk/high": ["b60205", "Large blast radius, release-sensitive, or core runtime change"],
              "risk/security": ["b60205", "Touches trust boundaries, token handling, MCP policy, or security workflows"],
              "risk/migration": ["d93f0b", "May affect persisted memory, schemas, config, or user data migration"],
              "risk/agent-runtime": ["5319e7", "May affect agent spawning, loops, receipts, or autonomous execution"],
              "size/XS": ["c2e0c6", "Tiny change: less than 20 changed lines"],
              "size/S": ["0e8a16", "Small change: less than 100 changed lines"],
              "size/M": ["fbca04", "Medium change: less than 400 changed lines"],
              "size/L": ["d93f0b", "Large change: less than 1000 changed lines"],
              "size/XL": ["b60205", "Very large change: 1000 or more changed lines"],
            };

            const managedPrefixes = ["priority/", "kind/", "size/", "risk/"];
            const docsOnlyExtensions = [".md", ".mdx", ".rst", ".txt"];
            const docsOnlyPaths = [
              "docs/",
              ".github/ISSUE_TEMPLATE/",
              ".github/pull_request_template.md",
              "README.md",
              "CONTRIBUTING.md",
              "CHANGELOG.md",
              "SECURITY.md",
              "CITATION.cff",
            ];

            const issue = await github.rest.issues.get({ owner, repo, issue_number });
            const currentLabels = issue.data.labels.map((label) => label.name);
            const pullRequest = issue.data.pull_request;
            const isPullRequest = Boolean(pullRequest);
            let pr = isPullRequestEvent ? context.payload.pull_request : null;

            if (isPullRequest && !pr) {
              const prResponse = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
              pr = prResponse.data;
            }

            async function listPrFiles() {
              if (!pr) return [];
              return github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: issue_number,
                per_page: 100,
              });
            }

            function lower(value) {
              return String(value || "").toLowerCase();
            }

            function pathMatchesAny(path, prefixesOrNames) {
              return prefixesOrNames.some((entry) => path === entry || path.startsWith(entry));
            }

            const files = await listPrFiles();
            const fileNames = files.map((file) => file.filename);
            const changedLines = files.reduce((sum, file) => sum + file.additions + file.deletions, 0);
            const text = lower([
              issue.data.title,
              issue.data.body,
              pr?.title,
              pr?.body,
              fileNames.join(" "),
            ].join("\n"));

            const docsOnly = isPullRequest && files.length > 0 && fileNames.every((file) => {
              if (pathMatchesAny(file, docsOnlyPaths)) return true;
              return docsOnlyExtensions.some((ext) => file.endsWith(ext));
            });
            const testsOnly = isPullRequest && files.length > 0 && fileNames.every((file) => {
              return file.startsWith("tests/") || file.includes("/tests/") || file.endsWith("_test.py") || file.endsWith("_tests.py");
            });
            const ciTouched = fileNames.some((file) => file.startsWith(".github/") || file.startsWith("scripts/"));
            const releaseTouched = fileNames.some((file) => file.includes("release") || file === "pyproject.toml" || file === "uv.lock");
            const dependencyTouched = fileNames.some((file) => file === "uv.lock" || file === "pyproject.toml" || file.startsWith(".github/dependabot"));
            const memoryTouched = fileNames.some((file) => file.includes("/storage/") || file.includes("/models/") || file.includes("/recall/") || file.includes("/ingest/"));
            const agentRuntimeTouched = fileNames.some((file) => {
              return ["/swarm/", "/loop/", "/autopilot/", "/nomistakes/", "/adapters/", "/hooks/"].some((part) => file.includes(part));
            });
            const securityTouched = fileNames.some((file) => file.includes("mcp_trust") || file.includes("security") || file.includes("audit"));

            const has = (...terms) => terms.some((term) => text.includes(term));
            const labels = new Set();

            if (docsOnly) labels.add("kind/docs");
            else if (testsOnly) labels.add("kind/tests");
            else if (ciTouched) labels.add("kind/ci");
            else if (dependencyTouched || has("dependabot", "dependency", "upgrade", "bump ")) labels.add("kind/dependencies");
            else if (releaseTouched || has("release", "publish", "changelog", "version")) labels.add("kind/release");
            else if (securityTouched || has("security", "secret", "token", "credential", "vulnerability", "cve", "rce", "trust boundary")) labels.add("kind/security");
            else if (has("bug", "fix", "broken", "regression", "traceback", "crash", "fails", "failure", "flaky")) labels.add("kind/bug");
            else if (has("refactor", "cleanup", "rename", "debt")) labels.add("kind/refactor");
            else labels.add("kind/feature");

            if (changedLines < 20) labels.add("size/XS");
            else if (changedLines < 100) labels.add("size/S");
            else if (changedLines < 400) labels.add("size/M");
            else if (changedLines < 1000) labels.add("size/L");
            else labels.add("size/XL");

            if (has("p0", "critical", "data loss", "rce", "leak", "secret", "prod down", "release broken", "cannot install")) {
              labels.add("priority/P0");
            } else if (agentRuntimeTouched || has("p1", "regression", "broken", "failing ci", "swarm", "loop", "receipt", "cannot run", "install fails")) {
              labels.add("priority/P1");
            } else if (docsOnly || testsOnly || has("p3", "docs", "typo", "cleanup", "nice to have")) {
              labels.add("priority/P3");
            } else {
              labels.add("priority/P2");
            }

            if (changedLines >= 400 || files.length >= 12 || releaseTouched || ciTouched) labels.add("risk/high");
            if (securityTouched || has("security", "secret", "token", "credential", "vulnerability", "cve", "rce", "mcp trust")) labels.add("risk/security");
            if (memoryTouched || has("migration", "schema", "backfill", "sqlite", "storage")) labels.add("risk/migration");
            if (agentRuntimeTouched || has("swarm", "loop", "agent runtime", "autopilot", "no-mistakes", "nomistakes")) labels.add("risk/agent-runtime");

            if (!currentLabels.some((label) => label.startsWith("status/"))) {
              labels.add("needs-triage");
            }

            async function ensureLabel(name) {
              const definition = labelDefinitions[name];
              if (!definition) return;
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: definition[0],
                  description: definition[1],
                });
              }
            }

            for (const name of labels) {
              await ensureLabel(name);
            }

            const labelsToRemove = currentLabels.filter((label) => {
              if (managedPrefixes.some((prefix) => label.startsWith(prefix))) return true;
              if (label === "documentation" && !docsOnly) return true;
              return false;
            });

            for (const name of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [...labels],
            });

            core.info(`Applied labels to #${issue_number}: ${[...labels].sort().join(", ")}`);
