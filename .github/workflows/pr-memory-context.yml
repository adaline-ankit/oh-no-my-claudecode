name: pr-memory-context

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-memory-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory-context:
    name: post memory context comment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install onmc
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build memory index
        run: |
          onmc init
          onmc ingest --no-llm || true

      - name: Generate memory context report
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          MARKER="<!-- onmc-pr-memory-context -->"
          REPORT_FILE="$(mktemp)"

          # Collect changed source files (up to 5)
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null \
            | grep -E '\.(py|ts|tsx|js|jsx|go|rs|java|rb|sh|yaml|yml|json|toml|md)$' \
            | head -5 || true)

          {
            echo "${MARKER}"
            echo "## ONMC Memory Context"
            echo ""
            echo "_Grounding context auto-generated by [onmc](https://github.com/$(echo "$GITHUB_REPOSITORY")). Not a review — informational only._"
            echo ""
          } >> "$REPORT_FILE"

          # Per-file why verdicts
          if [ -n "$CHANGED_FILES" ]; then
            {
              echo "### Changed files — memory context"
              echo ""
            } >> "$REPORT_FILE"

            while IFS= read -r file; do
              [ -z "$file" ] && continue
              echo "#### \`${file}\`" >> "$REPORT_FILE"
              WHY_OUT=$(onmc why "${file}" --no-llm 2>&1 || true)
              if [ -n "$WHY_OUT" ]; then
                echo '```' >> "$REPORT_FILE"
                echo "$WHY_OUT" | head -40 >> "$REPORT_FILE"
                echo '```' >> "$REPORT_FILE"
              else
                echo "_No specific memory recorded for this file._" >> "$REPORT_FILE"
              fi
              echo "" >> "$REPORT_FILE"
            done <<< "$CHANGED_FILES"
          else
            echo "_No tracked source files changed._" >> "$REPORT_FILE"
            echo "" >> "$REPORT_FILE"
          fi

          # Guard: surface known dead-ends for this PR task
          {
            echo "### Known dead-ends — do NOT retry"
            echo ""
          } >> "$REPORT_FILE"

          GUARD_OUT=$(onmc guard --task "${PR_TITLE}" 2>&1 || true)
          if [ -n "$GUARD_OUT" ]; then
            echo '```' >> "$REPORT_FILE"
            echo "$GUARD_OUT" | head -60 >> "$REPORT_FILE"
            echo '```' >> "$REPORT_FILE"
          else
            echo "_No recorded dead-ends match this task._" >> "$REPORT_FILE"
          fi

          echo "" >> "$REPORT_FILE"
          echo "---" >> "$REPORT_FILE"
          echo "_Updated: $(date -u '+%Y-%m-%dT%H:%M:%SZ') · commit \`${GITHUB_SHA::8}\`_" >> "$REPORT_FILE"

          cat "$REPORT_FILE"
          echo "REPORT_FILE=${REPORT_FILE}" >> "$GITHUB_ENV"

      - name: Post or update sticky PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MARKER="<!-- onmc-pr-memory-context -->"
          BODY=$(cat "$REPORT_FILE")

          # Find an existing comment from this bot containing the marker
          EXISTING_COMMENT_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
            | head -1 || true)

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            # Update existing comment
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING_COMMENT_ID}" \
              -f body="$BODY" \
              --silent
            echo "Updated existing comment #${EXISTING_COMMENT_ID}"
          else
            # Create new comment
            gh pr comment "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$BODY"
            echo "Posted new memory context comment"
          fi
