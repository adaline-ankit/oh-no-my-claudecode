name: brain-freshness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: brain freshness check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install onmc
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Regenerate brain artifacts
        run: |
          onmc init
          onmc ingest --no-llm
          onmc sync --commit
      - name: Report brain drift (informational only)
        run: |
          DRIFT=$(git diff --stat .agent-memory/ 2>/dev/null || true)
          if [ -n "$DRIFT" ]; then
            echo "::notice::Brain drift detected. Run 'onmc init && onmc ingest --no-llm && onmc sync --commit' locally and commit the result to keep .agent-memory/ fresh."
            echo "Drift summary:"
            git diff --stat .agent-memory/ || true
          else
            echo "::notice::Brain artifacts are up to date — no drift detected."
          fi
          exit 0
