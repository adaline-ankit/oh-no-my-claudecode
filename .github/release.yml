# GitHub auto-generated release notes categorization.
# PR titles following conventional-commit prefixes are sorted into sections.
# See: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  categories:
    - title: "New features"
      labels:
        - "type: feat"
      # Also match PRs whose squash-merge title starts with "feat"
    - title: "Bug fixes"
      labels:
        - "type: fix"
    - title: "Documentation"
      labels:
        - "type: docs"
    - title: "Performance"
      labels:
        - "type: perf"
    - title: "Maintenance"
      labels:
        - "type: chore"
        - "type: refactor"
        - "type: build"
        - "type: ci"
        - "dependencies"
    - title: "Other changes"
      labels:
        - "*"
